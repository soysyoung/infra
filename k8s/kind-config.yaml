# 05-1-kind-cluster.sh 가 envsubst 로 ${KIND_NODE_IMAGE} 를 채워서 kind 에 넘긴다.
# 노드: control-plane 1 + GPU 워커 1 + CPU 워커 CPU_WORKERS 개 (기본 2, 컨테이너 4개). 한 PC 위의 스케줄링 실습용 구성이라 고가용성은 아니다.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # kind 문서가 "강하게 권장" 하는 기본값(127.0.0.1)이다. 예전에는 tailnet 주소로 열었으나, 부팅 때 Docker 가 컨트롤 플레인을
  # 복원하는 순간 tailscale0 의 주소가 아직 없으면 컨테이너가 kind 네트워크에서 떨어지는 사고가 났다 (docs/decisions/0010).
  # 다른 기기에서는 kubectl 을 쓰지 않는다 (필요하면 tailnet 으로 SSH 해서 이 PC 에서 쓴다).
  # shortcut: 포트를 6443 으로 고정했다. 같은 PC 에서 6443 을 쓰는 다른 프로세스가 있으면 클러스터 생성이 실패하니 그때 이 줄을 지운다 (무작위 포트).
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
nodes:
  - role: control-plane
    image: ${KIND_NODE_IMAGE}
  # 첫 번째 워커(kind 이름: mlops-worker)가 GPU 노드다. 05-1 이 이 이름으로 라벨과 taint 를 건다.
  - role: worker
    image: ${KIND_NODE_IMAGE}
    extraMounts:
      # NVIDIA 마커 마운트: Docker 의 nvidia 런타임이 이 경로를 보고 노드에 GPU 와 WSL 라이브러리를 넣어 준다.
      # /dev/dxg, /usr/lib/wsl 을 직접 bind mount 하지 않는다 (nvkind 방식). 노드 생성 후에는 바꿀 수 없다.
      - hostPath: /dev/null
        containerPath: /var/run/nvidia-container-devices/all
  # CPU 워커는 05-1 이 cluster.env 의 CPU_WORKERS 개수만큼 이 파일 뒤에 붙인다.
