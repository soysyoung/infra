# verify/05-3-device-plugin.sh 가 envsubst 로 ${CUDA_TEST_IMAGE} 를 채워서 적용한다.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: nvidia-smi
      image: ${CUDA_TEST_IMAGE}
      command: ["nvidia-smi", "-L"]
      resources:
        limits:
          nvidia.com/gpu: 1
