# verify/05-kind.sh 가 envsubst 로 ${CUDA_TEST_IMAGE} 를 채워서 적용한다.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
spec:
  restartPolicy: Never
  containers:
    - name: nvidia-smi
      image: ${CUDA_TEST_IMAGE}
      command: ["nvidia-smi", "-L"]
      resources:
        limits:
          nvidia.com/gpu: 1
