# Notebook 안에서 kfp.Client() 가 Pipelines 에 접속할 때 쓰는 ServiceAccount 토큰을 파드에 넣는다.
# 출처: https://www.kubeflow.org/docs/components/pipelines/user-guides/core-functions/connect-api/ (PodDefault 예시)
# 적용: scripts/06-3-poddefaults.sh (직접 하려면 kubectl --context kind-mlops apply -f k8s/access-ml-pipeline-poddefault.yaml)
# 프로필 네임스페이스가 다르면 metadata.namespace 를 바꾼다.
apiVersion: kubeflow.org/v1alpha1
kind: PodDefault
metadata:
  name: access-ml-pipeline
  namespace: kubeflow-user-example-com
spec:
  desc: Allow access to Kubeflow Pipelines
  selector:
    matchLabels:
      access-ml-pipeline: "true"
  env:
    - name: KF_PIPELINES_SA_TOKEN_PATH
      value: /var/run/secrets/kubeflow/pipelines/token
  volumes:
    - name: volume-kf-pipeline-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 7200
              # ml-pipeline Deployment 의 TOKEN_REVIEW_AUDIENCE 와 같아야 한다
              audience: pipelines.kubeflow.org
  volumeMounts:
    - mountPath: /var/run/secrets/kubeflow/pipelines
      name: volume-kf-pipeline-token
      readOnly: true
